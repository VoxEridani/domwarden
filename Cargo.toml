[package]
name = "domwarden"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Watches your domains: expiring certificates and registrations, broken DNS, SPF/DKIM/DMARC email records and site availability — with alerts to Telegram, email and webhooks."
license = "MIT"
repository = "https://github.com/VoxEridani/domwarden"
readme = "README.md"
keywords = ["ssl", "certificate", "domain", "dmarc", "monitoring"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/"]

[dependencies]
anstream = "1"
anstyle = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
futures = "0.3"
hickory-resolver = "0.26"
idna = "1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
psl = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
